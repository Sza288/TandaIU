name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
      lint: ${{ steps.lint.outcome }}
      tests: ${{ steps.tests.outcome }}
      has_tests: ${{ steps.detect.outputs.has_tests }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Detect test script
        id: detect
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Tests
        id: tests
        if: steps.detect.outputs.has_tests == 'true'
        continue-on-error: true
        run: npm test -- --ci

      - name: Fail if any check failed
        if: >-
          steps.typecheck.outcome != 'success' ||
          steps.lint.outcome != 'success' ||
          (steps.detect.outputs.has_tests == 'true' && steps.tests.outcome != 'success')
        run: exit 1

  conflicts:
    name: Merge conflicts with base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      clean: ${{ steps.merge.outputs.clean }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attempt merge with base branch
        id: merge
        run: |
          set +e
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin "${{ github.base_ref }}"
          git merge --no-commit --no-ff "origin/${{ github.base_ref }}"
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflicts=$files" >> "$GITHUB_OUTPUT"
          fi
          git merge --abort || true

  report:
    name: Report on PR
    needs: [checks, conflicts]
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        env:
          TYPECHECK: ${{ needs.checks.outputs.typecheck }}
          LINT: ${{ needs.checks.outputs.lint }}
          TESTS: ${{ needs.checks.outputs.tests }}
          HAS_TESTS: ${{ needs.checks.outputs.has_tests }}
          CLEAN: ${{ needs.conflicts.outputs.clean }}
          CONFLICTS: ${{ needs.conflicts.outputs.conflicts }}
        with:
          script: |
            const result = (s) => (s === 'success' ? '✅ pass' : `❌ ${s || 'failed'}`);
            const hasTests = process.env.HAS_TESTS === 'true';
            const marker = '<!-- pr-checks -->';
            const lines = [
              marker,
              '## PR checks',
              '',
              '| Check | Result |',
              '| --- | --- |',
              `| Typecheck (\`tsc --noEmit\`) | ${result(process.env.TYPECHECK)} |`,
              `| Lint (\`expo lint\`) | ${result(process.env.LINT)} |`,
              hasTests
                ? `| Tests (\`npm test\`) | ${result(process.env.TESTS)} |`
                : '| Tests | ⚠️ no test script configured |',
              `| Merge with \`${context.payload.pull_request.base.ref}\` | ${
                process.env.CLEAN === 'true' ? '✅ clean' : '❌ conflicts'
              } |`,
            ];
            if (process.env.CLEAN !== 'true' && process.env.CONFLICTS) {
              lines.push('', '**Conflicting files:**', '```', process.env.CONFLICTS.trim(), '```');
            }
            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
